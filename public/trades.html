<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nottingham Park Houses — Occupations</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI', Arial, sans-serif; background:#0f1923; color:#e8e0d0; min-height:100vh; }
.hero { background:linear-gradient(135deg,#1a2a1a 0%,#1a1a2e 100%); padding:2rem 2rem 1.5rem; text-align:center; border-bottom:1px solid #2a2a3a; }
.hero h1 { font-size:1.8rem; color:#c8b87a; font-weight:300; letter-spacing:0.08em; }
.hero p { color:#8a9a7a; margin-top:0.4rem; font-size:0.88rem; }
.main { max-width:1200px; margin:0 auto; padding:2rem; }
.stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:2rem; }
.stat-card { background:linear-gradient(135deg,#1e2d1e,#1a2030); border:1px solid #2a3a2a; border-radius:10px; padding:1.2rem; text-align:center; }
.stat-card .val { font-size:2rem; font-weight:700; color:#c8b87a; }
.stat-card .label { font-size:0.7rem; color:#8a9a7a; margin-top:0.3rem; text-transform:uppercase; letter-spacing:0.05em; }
.panel { background:#141e14; border:1px solid #2a3a2a; border-radius:12px; padding:1.4rem; margin-bottom:1.5rem; }
.panel h2 { font-size:0.95rem; font-weight:600; color:#c8b87a; margin-bottom:0.3rem; display:flex; align-items:center; gap:0.5rem; }
.panel .sub { font-size:0.75rem; color:#6a7a6a; margin-bottom:1rem; padding-bottom:0.7rem; border-bottom:1px solid #2a3a2a; line-height:1.55; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:1.5rem; }
@media(max-width:900px){ .grid2 { grid-template-columns:1fr; } }
.bar-row { display:flex; align-items:center; gap:0.6rem; margin-bottom:0.45rem; font-size:0.8rem; }
.bar-row .lbl { width:190px; color:#a8b8a8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex-shrink:0; }
.bar-row .bar { height:14px; border-radius:3px; min-width:2px; }
.bar-row .cnt { color:#c8b87a; font-weight:600; font-size:0.75rem; }
.grp { display:inline-block; font-size:0.62rem; color:#6a7a6a; margin-left:0.35rem; }
.chips { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:0.9rem; }
.chip { background:#1a2a1a; border:1px solid #2a3a2a; border-radius:20px; padding:0.25rem 0.75rem; font-size:0.74rem; color:#8a9a7a; cursor:pointer; user-select:none; display:flex; align-items:center; gap:0.35rem; }
.chip.on { color:#e8e0d0; border-color:#4a5a4a; background:#1e2e1e; }
.chip .dot { width:9px; height:9px; border-radius:50%; }
.one { background:#101a10; border:1px solid #243424; border-radius:8px; padding:0.6rem 0.8rem; margin-bottom:0.4rem; font-size:0.8rem; }
.one .occ { color:#c8b87a; font-weight:600; }
.one .who { color:#8a9a7a; font-size:0.74rem; }
.one a { color:#5b9bd5; text-decoration:none; }
.one a:hover { text-decoration:underline; }
canvas { max-height:320px; }
.spinner { text-align:center; padding:3rem; color:#5a7a5a; }
.note { font-size:0.74rem; color:#6a7a6a; line-height:1.55; margin-top:0.9rem; padding-top:0.7rem; border-top:1px solid #1e2a1e; }
.note a { color:#5b9bd5; }
</style>
</head>
<body>
<script src="/site-nav.js"></script>
<div class="hero">
  <h1>Occupations</h1>
  <p>What the people of The Park did for a living, and how it changed</p>
</div>
<div class="main" id="main"><div class="spinner">Counting the trades…</div></div>

<script>
function esc(v){ if(v===null||v===undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const COLOURS = ['#c8b87a','#4caf82','#5b9bd5','#e07b39','#a679d5','#d55b7a','#79d5c8','#d5c879',
                 '#7a9ad5','#8ad579','#d58a79','#9a7ad5','#5ad5a0','#d5799a','#79b8d5'];
let DATA=null, chart=null, off=new Set();

async function load(){
  const d = await fetch('/api/trades').then(r=>r.json());
  DATA = d;
  if (d.error){ document.getElementById('main').innerHTML = `<div class="spinner">${esc(d.error)}</div>`; return; }

  const names = groupOrder(d);
  const totalMentions = d.top.reduce((a,t)=>a+Number(t.n),0);

  document.getElementById('main').innerHTML = `
  <div class="stat-row">
    <div class="stat-card"><div class="val">${d.distinct.toLocaleString()}</div><div class="label">Distinct trades</div></div>
    <div class="stat-card"><div class="val">${names.length}</div><div class="label">Trade groups</div></div>
    <div class="stat-card"><div class="val">${d.singles.count.toLocaleString()}</div><div class="label">Done by one person only</div></div>
    <div class="stat-card"><div class="val">${(d.employers||[]).length}</div><div class="label">Named employers</div></div>
  </div>

  <div class="panel">
    <h2>🏭 The trades of the estate, round by round</h2>
    <div class="sub">Every occupation the census recorded, sorted into groups. Click a group to take it out of the chart. This is the shape of a Nottingham suburb: the lace trade rising and falling, domestic service dominating throughout, and the professions holding steady underneath.</div>
    <div class="chips" id="chips"></div>
    <canvas id="groupChart"></canvas>
    <div class="note"><b>Not yet grouped</b> is drawn last and in grey because it is not a trade: it is what the
      <a href="/occupations">Occupations to sort</a> tool has left to do. Watching that band shrink is the point of it.
      Counted from the occupation column of the census, across the five full rounds. Where a household wrote a trade, an industry and an employment status in one line, only the trade is counted. Spellings are normalised by the same table the <a href="/occupations">Occupations to sort</a> tool uses, so the page and the tool always agree.</div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>📋 The commonest trades</h2>
      <div class="sub">Across every year the record holds.</div>
      ${bars(d.top.slice(0,18))}
    </div>
    <div class="panel">
      <h2>🎩 Done by one person, once</h2>
      <div class="sub">${d.singles.count} trades appear a single time in the whole record. These are the ones a chart of the commonest jobs will never show you.</div>
      ${(d.singles.examples||[]).slice(0,14).map(s=>
        `<div class="one"><span class="occ">${esc(s.occ)}</span>
          <div class="who">${s.name ? `<a href="/people/${s.id}">${esc(s.name)}</a>` : 'unnamed'} · ${s.yr}</div></div>`).join('')
        || '<div style="font-size:0.82rem;color:#5a7a5a">Nothing yet.</div>'}
    </div>
  </div>

  ${(d.employers||[]).length ? `
  <div class="panel">
    <h2>🏢 Named employers</h2>
    <div class="sub">Where research has established who somebody actually worked for, rather than only what they did.</div>
    ${bars((d.employers||[]).map(e=>({occ:e.employer, n:e.n})))}
  </div>` : ''}
  `;

  buildChips(names);
  drawChart();
}

function bars(items){
  if(!items.length) return '<div style="font-size:0.82rem;color:#5a7a5a">Nothing recorded yet.</div>';
  const max = Math.max(...items.map(i=>Number(i.n))) || 1;
  return items.map((it,i)=>{
    const w = Math.round(Number(it.n)/max*100);
    return `<div class="bar-row">
      <div class="lbl" title="${esc(it.occ)}">${esc(it.occ)}${it.group?`<span class="grp">${esc(it.group)}</span>`:''}</div>
      <div class="bar" style="width:${w}%;max-width:calc(100% - 255px);background:linear-gradient(90deg,${COLOURS[i%COLOURS.length]}55,${COLOURS[i%COLOURS.length]})"></div>
      <div class="cnt">${it.n}</div></div>`;
  }).join('');
}

function buildChips(names){
  document.getElementById('chips').innerHTML = names.map(g=>
    `<div class="chip on" data-g="${esc(g)}"><span class="dot" style="background:${colourOf(g)}"></span>${esc(g)}</div>`
  ).join('');
  document.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    const g = el.dataset.g;
    if (off.has(g)) { off.delete(g); el.classList.add('on'); }
    else { off.add(g); el.classList.remove('on'); }
    drawChart();
  });
}

// Biggest first, but the ungrouped bucket always last however large it is. It is
// not a trade - it is how much the Occupations to sort tool has left to do - and
// putting it in the middle of the real categories reads as though it were one.
const UNGROUPED = 'Not yet grouped';
function groupOrder(d){
  const size = g => Object.values(d.groups[g]).reduce((x,y)=>x+y,0);
  return Object.keys(d.groups)
    .sort((a,b)=> (a===UNGROUPED) - (b===UNGROUPED) || size(b) - size(a));
}
function colourOf(g){
  if (g === UNGROUPED) return '#5a6a5a';
  return COLOURS[groupOrder(DATA).filter(x=>x!==UNGROUPED).indexOf(g) % COLOURS.length];
}
function drawChart(){
  const names = groupOrder(DATA).filter(g => !off.has(g));
  const ds = names.map((g,i)=>({
    label: g,
    data: DATA.spine.map(y => DATA.groups[g][y] || 0),
    backgroundColor: colourOf(g) + 'cc',
    borderColor: colourOf(g),
    borderWidth: 1
  }));
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('groupChart'), {
    type:'bar',
    data:{ labels: DATA.spine, datasets: ds },
    options:{
      responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ footer: items => 'total ' + items.reduce((a,i)=>a+i.parsed.y,0) } } },
      scales:{ x:{ stacked:true, ticks:{color:'#8a9a7a'}, grid:{color:'#1a2a1a'} },
               y:{ stacked:true, ticks:{color:'#8a9a7a'}, grid:{color:'#1a2a1a'} } }
    }
  });
}

load();
</script>
</body>
</html>
