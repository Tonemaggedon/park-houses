<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unresolved Census People — Nottingham Park Houses</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: #f5f0e8; color: #2c2416; min-height: 100vh; }

header {
  background: #1a3a2a; color: #e8dfc8;
  padding: 0 20px; height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 6px rgba(0,0,0,0.35); position: sticky; top: 0; z-index: 100;
}
header h1 { font-size: 1.2rem; font-weight: normal; }
header h1 span { font-size: 0.75rem; display: block; color: #90b090; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
nav { display: flex; gap: 6px; align-items: center; }
nav a {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
  color: #e8dfc8; padding: 5px 13px; border-radius: 4px;
  font-size: 0.8rem; text-decoration: none; transition: background 0.2s;
}
nav a:hover { background: rgba(255,255,255,0.2); }
nav a.active { background: #4a7c5a; border-color: #3a6a4a; }

.page-head {
  background: #2c4a38; color: #e8dfc8;
  padding: 22px 28px 18px;
  border-bottom: 2px solid #1a3a2a;
}
.page-head h2 { font-size: 1.4rem; font-weight: normal; margin-bottom: 4px; }
.page-head p { font-size: 0.83rem; color: #a0c0a0; }
.page-head .summary { margin-top: 10px; font-size: 0.82rem; color: #c8d8b8; }

.main { max-width: 1060px; margin: 0 auto; padding: 24px 20px; }

.access-denied {
  background: white; border: 2px solid #e8d8b0; border-radius: 10px;
  padding: 40px; text-align: center; color: #6a5a3a; margin-top: 24px;
}
.access-denied h3 { font-size: 1.1rem; margin-bottom: 8px; color: #3a2a0a; }

.group-card {
  background: white; border: 1px solid #d8cead; border-radius: 8px;
  margin-bottom: 16px; overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  transition: opacity 0.4s;
}
.group-card.done { opacity: 0.35; pointer-events: none; }

.group-head {
  background: #f0ead8; padding: 9px 14px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border-bottom: 1px solid #e0d4b8;
}
.group-addr { font-weight: bold; color: #2a1a00; font-size: 0.95rem; min-width: 140px; }
.group-meta { font-size: 0.75rem; color: #8a7a5a; white-space: nowrap; }

/* Property picker — always visible inline */
.prop-picker {
  flex: 1; min-width: 200px; max-width: 340px;
  padding: 5px 8px; border: 1px solid #c8b888; border-radius: 4px;
  font-family: Georgia, serif; font-size: 0.78rem;
  background: white; color: #2c2416;
}

.assign-sel-btn {
  font-size: 0.75rem; padding: 4px 11px; background: #2e7d4f; color: white;
  border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif;
  white-space: nowrap;
}
.assign-sel-btn:hover { background: #256040; }
.assign-sel-btn:disabled { background: #aaa; cursor: default; }

.assign-all-btn {
  font-size: 0.75rem; padding: 4px 11px; background: #4a6a8a; color: white;
  border: none; border-radius: 4px; cursor: pointer; font-family: Georgia, serif;
  white-space: nowrap;
}
.assign-all-btn:hover { background: #3a5a7a; }

.sel-count { font-size: 0.72rem; color: #6a5a3a; white-space: nowrap; min-width: 70px; }

.people-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.people-table th {
  background: #f8f4ec; padding: 6px 10px; text-align: left;
  font-weight: 600; color: #6a5a3a; font-size: 0.75rem;
  border-bottom: 1px solid #e8dfc8; letter-spacing: 0.03em;
}
.people-table th.cb-col { width: 32px; text-align: center; }
.people-table td { padding: 6px 10px; border-bottom: 1px solid #f0e8d8; color: #3a2a0a; vertical-align: middle; }
.people-table tr:last-child td { border-bottom: none; }
.people-table tr:not(.assigned):hover td { background: #fdf8f0; }
.people-table tr.selected td { background: #eef5e8 !important; }
.people-table tr.assigned td { opacity: 0.4; text-decoration: line-through; text-decoration-color: #aaa; }
.people-table tr.assigned td.cb-cell,
.people-table tr.assigned td.done-cell { text-decoration: none; opacity: 1; }
.person-link { color: #1a5a8a; text-decoration: none; }
.person-link:hover { text-decoration: underline; }

.done-label { font-size: 0.72rem; color: #2e7d4f; white-space: nowrap; }

.empty { text-align: center; padding: 48px 24px; color: #6a7a6a; font-size: 0.95rem; }
.empty big { display: block; font-size: 2.5rem; margin-bottom: 12px; }

.loading { text-align: center; padding: 40px; color: #8a7a5a; font-style: italic; }
.error { background: #fdf0f0; border: 1px solid #e8b0a0; border-radius: 6px;
         padding: 14px 18px; color: #803030; margin-top: 16px; }

.filter-bar {
  background: white; border: 1px solid #d8cead; border-radius: 8px;
  padding: 10px 14px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.filter-bar label { font-size: 0.82rem; color: #6a5a3a; }
.filter-bar input {
  padding: 4px 10px; border: 1px solid #c8b888; border-radius: 4px;
  font-family: Georgia, serif; font-size: 0.82rem; flex: 1; min-width: 180px;
}
.count-badge {
  background: #2e7d4f; color: white; font-size: 0.72rem; font-family: Arial, sans-serif;
  padding: 2px 7px; border-radius: 10px; font-weight: bold;
}
</style>
</head>
<body>

<header>
  <h1>Nottingham Park Estate
    <span>Historical Record</span>
  </h1>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/">Map</a>
    <a href="/people">People</a>
    <a href="/architects">Architects</a>
    <a href="/census" class="active">Census</a>
    <a href="/family-tree">Family Trees</a>
  </nav>
</header>

<div class="page-head">
  <h2>🔍 Unresolved Census People</h2>
  <p>People found in the census whose address could not be matched to a specific Park property</p>
  <div class="summary" id="summary"></div>
</div>

<div class="main" id="main">
  <div class="loading">Loading…</div>
</div>

<script>
let allGroups = [];
let allProps = [];
let canEdit = false;
let propOptsHtml = '';

async function init() {
  const me = await fetch('/api/me').then(r => r.json()).catch(() => ({}));
  canEdit = me.isAdmin || (me.user && (me.user.role === 'contributor' || me.user.role === 'admin') && me.user.approved);

  const main = document.getElementById('main');

  const [groupsRes, propsRes] = await Promise.all([
    fetch('/api/census/unresolved'),
    fetch('/api/all-props')
  ]);

  if (groupsRes.status === 403) {
    main.innerHTML = `<div class="access-denied">
      <h3>Contributor access required</h3>
      <p>Sign in as a contributor or admin to view unresolved census entries.</p>
    </div>`;
    return;
  }
  if (!groupsRes.ok) {
    const err = await groupsRes.json().catch(() => ({ error: groupsRes.statusText }));
    main.innerHTML = `<div class="error">Error loading data: ${err.error}</div>`;
    return;
  }

  allGroups = await groupsRes.json();
  allProps = (await propsRes.json().catch(() => [])).filter(p => !p.census_only);
  allProps.sort((a, b) => (a.street || '').localeCompare(b.street || '') || (a.no || '').localeCompare(b.no || ''));

  // Build option HTML once, reused in every group's picker
  propOptsHtml = allProps.map(p =>
    `<option value="${p.id}">${esc((p.no ? p.no + ' ' : '') + (p.street || p.name || 'Property ' + p.id))}</option>`
  ).join('');

  const totalPeople = allGroups.reduce((s, g) => s + g.people.length, 0);
  document.getElementById('summary').textContent =
    `${allGroups.length} address group${allGroups.length !== 1 ? 's' : ''} · ${totalPeople} people`;

  render(allGroups);
}

function render(groups) {
  const main = document.getElementById('main');

  if (!groups.length) {
    main.innerHTML = `<div class="empty"><big>✓</big>No unresolved census entries — everyone matched!</div>`;
    return;
  }

  let html = `<div class="filter-bar">
    <label>Filter:</label>
    <input type="text" id="filterInput" placeholder="Search by address or name…" oninput="filterGroups()">
    <span id="filterCount" class="count-badge">${groups.length}</span>
  </div>`;

  html += `<div id="groupList">` + groups.map((g, gi) => {
    const editControls = canEdit ? `
      <select class="prop-picker" id="picker_${gi}">
        <option value="">— assign to property —</option>
        ${propOptsHtml}
      </select>
      <span class="sel-count" id="selcount_${gi}"></span>
      <button class="assign-sel-btn" id="selbtn_${gi}" onclick="assignSelected(${gi})" disabled>Assign selected</button>
      <button class="assign-all-btn" onclick="assignAll(${gi})">Assign all</button>` : '';

    const cbTh = canEdit ? `<th class="cb-col"><input type="checkbox" title="Select all" onchange="toggleAll(${gi}, this.checked)"></th>` : '';

    const rows = g.people.map((p, pi) => {
      const cbCell = canEdit
        ? `<td class="cb-cell" style="text-align:center"><input type="checkbox" data-gi="${gi}" data-pi="${pi}" onchange="onCheck(${gi})"></td>`
        : '';
      return `<tr data-gi="${gi}" data-pi="${pi}">
        ${cbCell}
        <td><a class="person-link" href="/person/${p.person_id}" target="_blank">${esc(p.name)}</a></td>
        <td>${esc(p.relationship) || '—'}</td>
        <td>${p.age != null ? p.age : '—'}</td>
        <td>${esc(p.occupation) || '—'}</td>
        <td style="font-size:0.75rem;color:#8a7a5a">${esc(p.source) || ''}</td>
        ${canEdit ? `<td class="done-cell"></td>` : ''}
      </tr>`;
    }).join('');

    const doneTh = canEdit ? `<th></th>` : '';

    return `<div class="group-card" id="card_${gi}" data-addr="${esc(g.address || '')}" data-names="${g.people.map(p=>p.name).join(' ').toLowerCase()}">
      <div class="group-head">
        <span class="group-addr">${esc(g.address) || '<em style="color:#8a7a5a">(no address recorded)</em>'}</span>
        <span class="group-meta">${g.year} census · ${g.people.length} person${g.people.length !== 1 ? 's' : ''}</span>
        ${editControls}
      </div>
      <table class="people-table">
        <thead><tr>${cbTh}<th>Name</th><th>Relationship</th><th>Age</th><th>Occupation</th><th>Source</th>${doneTh}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('') + `</div>`;

  main.innerHTML = html;
}

// ── Checkbox handling ─────────────────────────────────────────────────────────

function toggleAll(gi, checked) {
  document.querySelectorAll(`input[type=checkbox][data-gi="${gi}"]`).forEach(cb => {
    const pi = parseInt(cb.dataset.pi);
    if (!allGroups[gi].people[pi]._assigned) cb.checked = checked;
  });
  onCheck(gi);
}

function onCheck(gi) {
  const cbs = document.querySelectorAll(`input[type=checkbox][data-gi="${gi}"]`);
  const n = [...cbs].filter(cb => cb.checked).length;
  const countEl = document.getElementById('selcount_' + gi);
  const btn = document.getElementById('selbtn_' + gi);
  if (countEl) countEl.textContent = n ? `${n} selected` : '';
  if (btn) btn.disabled = n === 0;
  // Update row highlight
  cbs.forEach(cb => {
    const row = cb.closest('tr');
    if (row) row.classList.toggle('selected', cb.checked);
  });
}

// ── Assign actions ────────────────────────────────────────────────────────────

async function assignSelected(gi) {
  const propId = parseInt(document.getElementById('picker_' + gi).value);
  if (!propId) { alert('Please choose a property first.'); return; }

  const cbs = [...document.querySelectorAll(`input[type=checkbox][data-gi="${gi}"]`)].filter(cb => cb.checked);
  if (!cbs.length) return;

  const btn = document.getElementById('selbtn_' + gi);
  btn.disabled = true; btn.textContent = 'Saving…';

  for (const cb of cbs) {
    const pi = parseInt(cb.dataset.pi);
    const ok = await resolveEntry(allGroups[gi].people[pi].entry_id, propId);
    if (ok) {
      allGroups[gi].people[pi]._assigned = true;
      markRowAssigned(gi, pi);
      cb.checked = false;
    }
  }
  onCheck(gi);
  checkGroupDone(gi);
  btn.textContent = 'Assign selected';
}

async function assignAll(gi) {
  const propId = parseInt(document.getElementById('picker_' + gi).value);
  if (!propId) { alert('Please choose a property first.'); return; }

  const group = allGroups[gi];
  const unassigned = group.people.filter(p => !p._assigned);
  if (!unassigned.length) { alert('All people in this group are already assigned.'); return; }

  const btn = document.querySelector(`#card_${gi} .assign-all-btn`);
  btn.disabled = true; btn.textContent = 'Saving…';

  let anyFail = false;
  for (let pi = 0; pi < group.people.length; pi++) {
    if (group.people[pi]._assigned) continue;
    const ok = await resolveEntry(group.people[pi].entry_id, propId);
    if (ok) {
      group.people[pi]._assigned = true;
      markRowAssigned(gi, pi);
    } else { anyFail = true; }
  }
  onCheck(gi);
  checkGroupDone(gi);
  btn.disabled = false; btn.textContent = 'Assign all';
  if (anyFail) alert('Some entries failed to save.');
}

async function resolveEntry(entryId, propId) {
  try {
    const r = await fetch('/api/census/resolve/' + entryId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ property_id: propId })
    });
    return r.ok;
  } catch (_) { return false; }
}

function markRowAssigned(gi, pi) {
  const row = document.querySelector(`#groupList tr[data-gi="${gi}"][data-pi="${pi}"]`);
  if (!row) return;
  row.classList.add('assigned');
  row.classList.remove('selected');
  const cb = row.querySelector('input[type=checkbox]');
  if (cb) { cb.checked = false; cb.disabled = true; }
  const doneCell = row.querySelector('.done-cell');
  if (doneCell) doneCell.innerHTML = '<span class="done-label">✓</span>';
}

function checkGroupDone(gi) {
  if (allGroups[gi].people.every(p => p._assigned)) {
    const card = document.getElementById('card_' + gi);
    if (card) card.classList.add('done');
  }
}

// ── Filter ────────────────────────────────────────────────────────────────────

function filterGroups() {
  const q = document.getElementById('filterInput').value.toLowerCase();
  const cards = document.querySelectorAll('#groupList .group-card');
  let visible = 0;
  cards.forEach(card => {
    const match = !q || card.dataset.addr.toLowerCase().includes(q) || card.dataset.names.includes(q);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  const badge = document.getElementById('filterCount');
  if (badge) badge.textContent = visible;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
