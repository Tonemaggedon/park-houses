<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What people have written in — Nottingham Park Houses</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico" sizes="32x32">
<style>
  :root { --ink:#2a2418; --soft:#6a5c44; --faint:#8a7a5a; --rule:#e0d8c4;
          --paper:#faf7ef; --card:#fff; --green:#2f4d27; --red:#a3341f; --amber:#8a5a12; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif; line-height:1.55; }
  .wrap { max-width:880px; margin:0 auto; padding:24px 20px 90px; }
  h2 { font-size:1.34rem; margin:0 0 6px; }
  .lede { color:var(--soft); font-size:.9rem; margin:0 0 14px; max-width:72ch; }
  .lede strong { color:var(--ink); }
  .bar { font-family:ui-monospace,Menlo,monospace; font-size:.78rem; color:var(--faint);
    margin:12px 0; }
  .tabs { display:flex; gap:6px; margin:4px 0 16px; flex-wrap:wrap; }
  .tab { border:1px solid var(--rule); background:#fff; border-radius:999px; padding:5px 13px;
    font-size:.8rem; cursor:pointer; color:var(--soft); font-family:inherit; }
  .tab.on { background:var(--green); border-color:var(--green); color:#f2ecd8; font-weight:600; }

  .m { background:var(--card); border:1px solid var(--rule); border-radius:9px;
    padding:14px 17px; margin-bottom:13px; }
  .m.urgent { border-color:#d9a08a; border-left:5px solid var(--red); border-radius:0 9px 9px 0; }
  .m.done { opacity:.62; }
  .m h3 { margin:0 0 3px; font-size:.95rem; }
  .m .who { font-size:.8rem; color:var(--faint); margin-bottom:9px; }
  .m .who a { color:var(--green); }
  .m .about { font-size:.84rem; color:var(--soft); margin-bottom:7px; }
  .m .body { white-space:pre-wrap; font-size:.92rem; margin-bottom:11px; }
  .m .note { font-size:.83rem; color:var(--green); font-style:italic; margin-bottom:9px; }
  .tag { display:inline-block; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase;
    padding:2px 8px; border-radius:999px; background:#efe9da; color:var(--soft); margin-left:7px;
    vertical-align:2px; }
  .tag.urgent { background:#f6e2db; color:var(--red); font-weight:600; }
  .acts { display:flex; gap:7px; flex-wrap:wrap; }
  button, a.btn { font-family:inherit; font-size:.78rem; border:1px solid var(--rule);
    background:#fff; color:var(--soft); border-radius:5px; padding:5px 11px; cursor:pointer;
    text-decoration:none; display:inline-block; }
  button:hover, a.btn:hover { border-color:#5a3a1a; color:var(--ink); }
  button.good { background:var(--green); border-color:var(--green); color:#f2ecd8; font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  .empty { color:var(--faint); font-style:italic; padding:30px 0; }
</style>
</head>
<body>
<script src="/site-nav.js"></script>
<div class="wrap">
  <h2>What people have written in</h2>
  <p class="lede">Everything sent through <a href="/contact">the form</a>.
    <strong>Anything asking for something to be taken down comes first</strong> and stays at the
    top until it is settled, whatever else has arrived since.</p>
  <div class="bar" id="bar">Loading…</div>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</div>

<script>
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const when = t => t ? new Date(t).toLocaleString('en-GB',
  { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '';

let ALL = [], KINDS = {}, filter = 'open';

async function load() {
  const r = await fetch('/api/admin/messages', { credentials:'same-origin' });
  if (r.status === 401 || r.status === 403) {
    document.getElementById('bar').textContent = '';
    document.getElementById('list').innerHTML =
      '<p class="empty">Sign in as admin to see these.</p>';
    return;
  }
  const d = await r.json();
  ALL = d.messages || []; KINDS = d.kinds || {};
  draw();
}

function draw() {
  const open = ALL.filter(m => !m.done_at);
  const urgent = open.filter(m => m.kind === 'takedown');
  document.getElementById('bar').innerHTML = urgent.length
    ? `<span style="color:#a3341f">${urgent.length} waiting to be taken down</span> · `
      + `${open.length} open · ${ALL.length} in all`
    : `${open.length} open · ${ALL.length} in all`;

  document.getElementById('tabs').innerHTML = [
    ['open', 'Still open', open.length],
    ['takedown', 'Takedowns', ALL.filter(m => m.kind === 'takedown').length],
    ['all', 'Everything', ALL.length],
  ].map(([k, l, n]) =>
    `<button class="tab${filter === k ? ' on' : ''}" data-k="${k}">${l} (${n})</button>`).join('');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { filter = t.dataset.k; draw(); });

  const list = ALL.filter(m =>
    filter === 'open' ? !m.done_at : filter === 'takedown' ? m.kind === 'takedown' : true);

  document.getElementById('list').innerHTML = list.length ? list.map(m => {
    const urgent = m.kind === 'takedown' && !m.done_at;
    const subject = encodeURIComponent('Nottingham Park Houses — your message');
    return `<div class="m${urgent ? ' urgent' : ''}${m.done_at ? ' done' : ''}" id="${m.id}">
      <h3>${esc(KINDS[m.kind] || m.kind)}
        ${m.kind === 'takedown' ? '<span class="tag urgent">take down</span>' : ''}
        ${m.done_at ? '<span class="tag">settled</span>' : ''}</h3>
      <div class="who">${esc(when(m.at))} · ${esc(m.name || 'no name given')} ·
        <a href="mailto:${esc(m.email)}?subject=${subject}">${esc(m.email)}</a>
        ${m.from_who ? ' · signed in as ' + esc(m.from_who) : ''}</div>
      ${m.about ? `<div class="about"><strong>About:</strong> ${esc(m.about)}</div>` : ''}
      <div class="body">${esc(m.body)}</div>
      ${m.note ? `<div class="note">${esc(m.note)}${m.done_by ? ' — ' + esc(m.done_by) : ''}</div>` : ''}
      <div class="acts">
        ${m.done_at
          ? `<button data-id="${m.id}" data-done="0">Open it again</button>`
          : `<button class="good" data-id="${m.id}" data-done="1">Settled</button>`}
        <a class="btn" href="mailto:${esc(m.email)}?subject=${subject}">Write back</a>
        ${m.from_url ? `<a class="btn" href="${esc(m.from_url)}">The page they were on</a>` : ''}
      </div></div>`;
  }).join('') : '<p class="empty">Nothing here.</p>';

  document.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
    const done = b.dataset.done === '1';
    const note = done ? (prompt('What was done about it? (optional)') || null) : null;
    b.disabled = true;
    try {
      const r = await fetch('/api/admin/messages/' + b.dataset.id, {
        method:'POST', credentials:'same-origin',
        headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ done, note }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Would not save');
      const m = ALL.find(x => x.id === +b.dataset.id);
      if (m) { m.done_at = done ? new Date().toISOString() : null; if (note) m.note = note; }
      draw();
    } catch (e) { alert(e.message); b.disabled = false; }
  });

  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

load().catch(e => { document.getElementById('list').innerHTML =
  '<p class="empty">' + esc(e.message) + '</p>'; });
</script>
</body>
</html>
