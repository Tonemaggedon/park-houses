<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Nottingham Park Houses</title>
  <!-- The estate's own colours: the dark green of the site's masthead, the cream
       of its type, and the gold it uses for a highlight, here a lit doorway. A
       gabled villa with one chimney — the shape repeated up every street in The
       Park — drawn as solid blocks so it still reads at sixteen pixels. -->
  <rect width="64" height="64" rx="13" fill="#25401f"/>
  <rect x="42" y="13" width="6" height="14" fill="#f2ecd8"/>
  <path d="M32 11 L54 30 L54 52 L10 52 L10 30 Z" fill="#f2ecd8"/>
  <rect x="28.5" y="37" width="7" height="15" rx="1" fill="#c8b87a"/>
</svg>
